<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Catálogo de Joyas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2 { font-family: 'Playfair Display', serif; }
        .admin-panel {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.7);
            z-index: 50;
        }
        .admin-panel.visible {
            display: flex;
        }
        .admin-panel-card {
            width: min(95vw, 480px);
            background: white;
            border-radius: 1.25rem;
            padding: 1.5rem;
            box-shadow: 0 25px 60px rgba(15, 23, 42, 0.2);
            position: relative;
            max-height: 90vh;
            overflow: hidden;
        }
        .admin-panel-card h3 {
            font-weight: 700;
            margin-bottom: 1rem;
        }
        #admin-list {
            max-height: 56vh;
            overflow-y: auto;
            padding-right: 0.35rem;
        }
        #admin-list::-webkit-scrollbar {
            width: 8px;
        }
        #admin-list::-webkit-scrollbar-thumb {
            background: rgba(110, 110, 110, 0.35);
            border-radius: 9999px;
        }
        .admin-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 0;
            border-bottom: 1px solid #e5e7eb;
        }
        .admin-row:last-child {
            border-bottom: none;
        }
        .admin-toggle {
            padding: 0.45rem 0.85rem;
            border-radius: 9999px;
            border: 1px solid transparent;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }
        .admin-toggle.available {
            background: #111827;
            color: #ffffff;
        }
        .admin-toggle.unavailable {
            background: #f8fafc;
            color: #dc2626;
            border-color: #fca5a5;
        }
        .admin-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: transparent;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            color: #6b7280;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <header class="py-10 text-center bg-white border-b">
        <h1 class="text-4xl uppercase tracking-widest">Mundo encanto y sorpresa</h1>
        <p class="text-gray-500 mt-2 italic">Piezas únicas para momentos inolvidables</p>
    </header>

    <main class="max-w-6xl mx-auto p-6">
        <div id="catalogo" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </main>

    <footer class="py-10 text-center text-gray-400 text-sm">
        <div class="mb-4">
            <a href="https://www.instagram.com/mundoencantoysorpresa?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank" class="inline-block text-gray-400 hover:text-pink-500 transition-colors duration-300 text-2xl">
                <i class="fab fa-instagram"></i>
            </a>
            <button id="admin-btn" class="ml-4 inline-block text-xs uppercase tracking-widest text-gray-400 hover:text-gray-700 transition-colors duration-200">Admin</button>
        </div>
        <p>&copy; 2025 Mundo encanto y sorpresa. Todos los derechos reservados.</p>
        <!-- Crédito de diseño - NO MODIFICAR -->
        <p class="text-xs text-gray-400 mt-2" style="opacity: 0.85;">Diseño web por Bridgette Toro Quiceno</p>
    </footer>

    <div id="admin-panel" class="admin-panel" aria-hidden="true">
        <div class="admin-panel-card">
            <button id="admin-close" class="admin-close" aria-label="Cerrar panel de administración">✕</button>
            <h3>Panel de administración</h3>
            <p class="text-sm text-gray-500 mb-4">Cambia el estado disponible/agotado desde aquí. Solo funciona si eres administrador.</p>
            <div id="admin-list"></div>
            <button id="admin-logout" class="mt-6 w-full px-4 py-3 rounded-full bg-gray-800 text-white text-sm font-semibold hover:bg-gray-900 transition-colors duration-200">Salir del modo admin</button>
        </div>
    </div>

    <script>
        
        const WHATSAPP_NUM = "573166994301"; 
        const ADMIN_PASSWORD = "Joyeria2026";
        const STORAGE_KEY = "joyeria_disponibilidad";
        let adminMode = false;
        const disponibilidadGuardada = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

        function obtenerDisponibilidad(joya) {
            if (disponibilidadGuardada.hasOwnProperty(joya.id)) {
                return disponibilidadGuardada[joya.id];
            }
            return joya.disponible;
        }

        function guardarDisponibilidad() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(disponibilidadGuardada));
        }

        function toggleDisponibilidad(id) {
            const idNum = Number(id);
            const joya = joyas.find(item => item.id === idNum);
            const actual = disponibilidadGuardada.hasOwnProperty(idNum) ? disponibilidadGuardada[idNum] : joya.disponible;
            disponibilidadGuardada[idNum] = !actual;
            guardarDisponibilidad();
            reloadProductos();
            renderAdminPanel();
        }

        function reloadProductos() {
            contenedor.innerHTML = "";
            cargarProductos();
        }

        function abrirAdmin() {
            const clave = prompt("Ingrese la contraseña de administrador:");
            if (clave === ADMIN_PASSWORD) {
                adminMode = true;
                renderAdminPanel();
                reloadProductos();
                return;
            }
            alert("Contraseña incorrecta.");
        }

        function cerrarAdmin() {
            adminMode = false;
            renderAdminPanel();
            reloadProductos();
        }

        function renderAdminPanel() {
            const panel = document.getElementById("admin-panel");
            const list = document.getElementById("admin-list");
            if (!panel || !list) return;
            if (!adminMode) {
                panel.classList.remove("visible");
                panel.setAttribute("aria-hidden", "true");
                return;
            }
            panel.classList.add("visible");
            panel.setAttribute("aria-hidden", "false");
            list.innerHTML = "";
            joyas.forEach(joya => {
                const disponible = obtenerDisponibilidad(joya);
                const row = document.createElement("div");
                row.className = "admin-row";
                row.innerHTML = `
                    <span class="text-sm text-gray-700">${joya.nombre}</span>
                    <button class="admin-toggle ${disponible ? 'available' : 'unavailable'}" data-id="${joya.id}">
                        ${disponible ? 'Marcar agotado' : 'Marcar disponible'}
                    </button>
                `;
                list.appendChild(row);
            });
            list.querySelectorAll(".admin-toggle").forEach(button => {
                button.addEventListener("click", () => toggleDisponibilidad(button.dataset.id));
            });
        }

        const joyas = [
            {
                id: 1,
                nombre: "Anillo Doble Gota",
                precio: 12000,
                disponible: true,
                imagen: "imagenes/anillo_doble_ gota.jpeg",
                descripcion: "Anillo con diseño único en rodio, perfecto para brillar en cualquier ocasión."
            },
            {
                id: 2,
                nombre: "Anillo Cenicienta",
                precio: 12000,
                disponible: true,
                imagen: "imagenes/Anillo_cenicienta.jpeg",
                descripcion: "Un diseño clásico y sofisticado que nunca pasa de moda."
            },
            {
                id: 3,
                nombre: "Anillo Doncella",
                precio: 12000,
                disponible: false,
                imagen: "imagenes/Anillo_doncella.jpeg",
                descripcion: " Un diseño entrelazado que resalta la belleza de lo sencillo y elegante."
            },
            {
                id: 4,
                nombre: "Anillo Esplendor",
                precio: 18000,
                disponible: true,
                imagen: "imagenes/Anillo_esplendor.jpeg",
                descripcion: "Un diseño de vanguardia en rodio que captura la luz desde todos los ángulos."
            },
           {
                id: 5,
                nombre: "Anillo Dulce Pecado",
                precio: 12000,
                disponible: true,
                imagen: "imagenes/Anillo_dulce_pecado.jpeg",
                descripcion: " La combinación perfecta de formas audaces y destellos delicados."
            },
            {
                    id: 6,
                    nombre: "Anillo Reina Esmeralda",
                    precio: 18000,
                    disponible: true,
                    imagen: "imagenes/Anillo_reina_esmeralda.jpeg",
                    descripcion: "Calidad excepcional con detalles que capturan miradas en cada movimiento."
          },
          {
                id: 7,
                nombre: "Anillo Nuevo Milenio",
                precio: 20000,
                disponible: true,
                imagen: "imagenes/Anillo_nuevo_milenio.jpeg",
                descripcion: "Diseño delicado con detalles en plata esterlina."
          },
          {
                id: 8,
                nombre: "Anillo Fenix",
                precio: 10000,
                disponible: true,
                imagen: "imagenes/Anillo_fenix.jpeg",
                descripcion: "Pieza elegante con acabado en rodio."
          },
          {
                id: 9,
                nombre: "Anillo Mar De Plata",
                precio: 20000,
                disponible: true,
                imagen: "imagenes/Anillo_mar_ de_plata.jpeg",
                descripcion: "Diseño romántico con detalles en oro rosa."
          },
          {
                id: 10,
                nombre: "Topitos Amazonas",
                precio: 15000,
                disponible: true,
                imagen: "imagenes/Topitos_amazonas.jpeg",
                descripcion: "Pieza majestuosa con incrustaciones de piedras preciosas."
          },
          {
                id: 11,
                nombre: "Cadena Silver Helix",
                precio: 15000,
                disponible: true,
                imagen: "imagenes/Cadena_silver_helix.jpeg",
                descripcion: "Diseño delicado con detalles en plata esterlina."
          },
          {
                id: 12,
                nombre: "Cadena Neptuno",
                precio: 15000,
                disponible: true,
                imagen: "imagenes/Cadena_neptuno.jpeg",
                descripcion: "Pieza elegante con acabado en rodio."
          },
          {
                id: 13,
                nombre: "Cadena Destellos del Alma",
                precio: 15000,
                disponible: true,
                imagen: "imagenes/Cadena_destellos_del_alma.jpeg",
                descripcion: "Combina la luz de la estrella con el sentimiento de los corazones."
          },
          {
                id: 14,
                nombre: "Cadena Trebol De Versalles",
                precio: 35000,
                disponible: false,
                imagen: "imagenes/Cadena_trebol_de_versalles.jpeg",
                descripcion: "Diseño romántico con detalles en oro rosa."
          },
          {
                id: 15,
                nombre: "Cadena Cascada Victoria",
                precio: 35000,
                disponible: true,
                imagen: "imagenes/Cadena_cascada_victoria.jpeg",
                descripcion: "Pieza majestuosa con incrustaciones de piedras preciosas."
          }
        ];

        // 2. LÓGICA PARA RENDERIZAR
        const contenedor = document.getElementById('catalogo');

        function cargarProductos() {
            joyas.forEach(joya => {
                const disponible = obtenerDisponibilidad(joya);
                const card = document.createElement('div');
                card.className = "bg-white overflow-hidden shadow-sm hover:shadow-xl transition-shadow duration-300 border border-gray-100 flex flex-col rounded-2xl";
                
              card.innerHTML = `
      <div class="relative" style="overflow: visible;"> <img src="${joya.imagen}" 
               alt="${joya.nombre}" 
               class="w-full h-72 object-cover transition-transform duration-500 ease-in-out ${disponible ? 'hover:scale-150 hover:z-50 hover:relative' : ''} ${!disponible ? 'grayscale opacity-50' : ''}">
          ${!disponible ? '<span class="absolute top-2 right-2 bg-black text-white px-3 py-1 text-xs uppercase">Agotado</span>' : ''}
      </div>
      <div class="p-6 flex flex-col flex-grow">
          <h2 class="text-xl mb-2">${joya.nombre}</h2>
          <p class="text-gray-500 text-sm mb-4 flex-grow">${joya.descripcion}</p>
          <div class="flex justify-between items-center mt-auto">
              <span class="text-lg font-semibold">$${joya.precio.toLocaleString()}</span>
              <button 
                  onclick="pedirWhatsApp('${joya.nombre}', ${joya.precio})"
                  ${!disponible ? 'disabled' : ''}
                  class="px-6 py-3 rounded-lg font-medium tracking-widest text-sm ${disponible ? 'bg-black text-white shadow-md hover:shadow-xl hover:bg-gray-900 hover:scale-105 transform' : 'bg-gray-200 text-gray-400 cursor-not-allowed'} transition-all duration-300">
                  ${disponible ? 'Consultar' : 'Sin Stock'}
              </button>
          </div>
      </div>
  `;
            contenedor.appendChild(card);
            });
        }

        // 3. FUNCIÓN DE WHATSAPP
        function pedirWhatsApp(nombre, precio) {
            const mensaje = encodeURIComponent(`¡Hola! Vi tu catálogo web y me encantó este producto:\n\n💎 *${nombre}*\n💰 Precio: $${precio.toLocaleString()}\n\n¿Sigue disponible?`);
            window.open(`https://wa.me/${WHATSAPP_NUM}?text=${mensaje}`, '_blank');
        }

        cargarProductos();

        document.getElementById('admin-btn').addEventListener('click', abrirAdmin);
        document.getElementById('admin-close').addEventListener('click', cerrarAdmin);
        document.getElementById('admin-logout').addEventListener('click', cerrarAdmin);
    </script>
</body>
</html>
